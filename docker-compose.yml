version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - main

  banco-questoes:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./banco_questoes:/app
    environment:
      - COLETA_DISPONIVEL=0
    depends_on:
      db:
        condition: service_healthy
    networks:
      - main

volumes:
  postgres_data:

networks:
  main:
