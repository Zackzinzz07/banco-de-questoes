<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCI Concursos - Estude Agora</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #7c3aed;      /* Roxo Duolingo */
            --secondary: #ec4899;    /* Rosa quente */
            --success: #10b981;      /* Verde */
            --gold: #fbbf24;         /* Dourado (XP/badges) */
            --warn: #f97316;         /* Laranja */
            --bg-light: #f8fafc;     /* Claro */
            --bg-white: #ffffff;
            --text-dark: #1e293b;
            --text-gray: #64748b;
            --border-light: #e2e8f0;
        }

        body {
            font-family: 'Nunito Sans', 'Quicksand', -apple-system, sans-serif;
            background: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.6;
        }

        /* TOP BAR */
        .topbar {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.15);
        }

        .topbar-left h1 {
            font-size: 1.8em;
            font-weight: 700;
        }

        .topbar-right {
            display: flex;
            gap: 32px;
            align-items: center;
        }

        /* STREAK & XP */
        .stat-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 16px;
            border-radius: 12px;
            font-weight: 600;
            backdrop-filter: blur(10px);
        }

        .stat-icon {
            font-size: 1.5em;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.1); }
        }

        .stat-value {
            font-size: 1.2em;
            font-weight: 700;
        }

        /* CONTAINER */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 20px;
        }

        /* WELCOME SECTION */
        .welcome {
            background: white;
            padding: 32px;
            border-radius: 16px;
            margin-bottom: 32px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .welcome h2 {
            font-size: 1.6em;
            margin-bottom: 16px;
            color: var(--text-dark);
        }

        .welcome p {
            color: var(--text-gray);
            margin-bottom: 20px;
        }

        /* PROGRESS RING */
        .progress-ring-container {
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 20px;
        }

        .progress-ring {
            position: relative;
            width: 120px;
            height: 120px;
        }

        .progress-ring svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .progress-ring-circle {
            stroke: var(--border-light);
            fill: transparent;
            stroke-width: 8;
        }

        .progress-ring-circle-fill {
            stroke: url(#gradient);
            fill: transparent;
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 380;
            stroke-dashoffset: 380;
            animation: fillRing 0.8s ease-out forwards;
        }

        @keyframes fillRing {
            to { stroke-dashoffset: 0; }
        }

        .progress-ring-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .progress-ring-text .number {
            font-size: 2em;
            font-weight: 700;
            color: var(--primary);
        }

        .progress-ring-text .label {
            font-size: 0.75em;
            color: var(--text-gray);
        }

        .progress-ring-info h3 {
            font-size: 1.4em;
            margin-bottom: 8px;
        }

        .progress-ring-info p {
            color: var(--text-gray);
            margin-bottom: 12px;
        }

        .progress-ring-stats {
            display: flex;
            gap: 16px;
            font-size: 0.9em;
        }

        .progress-ring-stat {
            flex: 1;
            padding: 8px;
            background: var(--bg-light);
            border-radius: 8px;
        }

        .progress-ring-stat .value {
            font-weight: 700;
            color: var(--primary);
        }

        .progress-ring-stat .label {
            font-size: 0.75em;
            color: var(--text-gray);
        }

        /* GRID DE CARDS */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            border-color: var(--primary);
        }

        .card-icon {
            font-size: 3em;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .card-subtitle {
            font-size: 0.9em;
            color: var(--text-gray);
            margin-bottom: 16px;
        }

        .card-progress {
            height: 6px;
            background: var(--border-light);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .card-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 3px;
            transition: width 0.6s ease;
        }

        .card-stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.85em;
            margin-bottom: 12px;
        }

        .card-stat-label {
            color: var(--text-gray);
        }

        .card-stat-value {
            font-weight: 600;
            color: var(--text-dark);
        }

        .card-cta {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .card-cta:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4);
        }

        .card-cta:active {
            transform: scale(0.98);
        }

        /* BADGES SECTION */
        .badges-section {
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .badges-section h3 {
            font-size: 1.3em;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .badges-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 16px;
        }

        .badge {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 16px;
            background: var(--bg-light);
            border-radius: 12px;
            text-align: center;
            border: 2px solid var(--border-light);
            transition: all 0.3s ease;
        }

        .badge.unlocked {
            border-color: var(--gold);
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.1), transparent);
        }

        .badge:hover:not(.locked) {
            transform: scale(1.1);
            box-shadow: 0 8px 20px rgba(251, 191, 36, 0.2);
        }

        .badge-icon {
            font-size: 2em;
        }

        .badge-name {
            font-size: 0.8em;
            font-weight: 600;
            color: var(--text-dark);
        }

        .badge.locked {
            opacity: 0.4;
        }

        .badge.locked .badge-icon {
            filter: grayscale(100%);
        }

        /* CONFETTI */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: var(--gold);
            animation: fall 3s linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* LOADING */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-gray);
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-light);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .topbar {
                flex-direction: column;
                gap: 16px;
                align-items: flex-start;
            }

            .topbar-right {
                width: 100%;
                justify-content: space-around;
            }

            .topbar-left h1 {
                font-size: 1.4em;
            }

            .container {
                padding: 16px;
            }

            .welcome {
                padding: 20px;
            }

            .progress-ring-container {
                flex-direction: column;
                text-align: center;
            }

            .cards-grid {
                grid-template-columns: 1fr;
            }

            .badges-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        /* DARK MODE SUPPORT */
        @media (prefers-color-scheme: dark) {
            body {
                background: #0f172a;
                color: #f1f5f9;
            }

            .card, .welcome, .badges-section {
                background: #1e293b;
            }

            .card {
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            }

            .progress-ring-stat {
                background: #334155;
            }

            :root {
                --text-gray: #cbd5e1;
                --border-light: #475569;
                --bg-light: #334155;
            }
        }
    </style>
</head>
<body>
    <!-- TOP BAR -->
    <div class="topbar">
        <div class="topbar-left">
            <h1>🎓 Vamos Estudar!</h1>
        </div>
        <div class="topbar-right">
            <div class="stat-badge">
                <span class="stat-icon">🔥</span>
                <span class="stat-value" id="streak">-</span>
                <span>dias</span>
            </div>
            <div class="stat-badge">
                <span class="stat-icon">⭐</span>
                <span class="stat-value" id="xp">-</span>
                <span>XP</span>
            </div>
        </div>
    </div>

    <!-- CONTAINER -->
    <div class="container">
        <!-- WELCOME -->
        <div class="welcome">
            <h2>Bem-vindo! 🎯</h2>
            <p>Seu progresso está sendo rastreado. Quanto mais você estuda, mais badges você desbloqueia.</p>

            <div class="progress-ring-container">
                <div class="progress-ring">
                    <svg viewBox="0 0 120 120">
                        <defs>
                            <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <circle class="progress-ring-circle" cx="60" cy="60" r="54"></circle>
                        <circle class="progress-ring-circle-fill" cx="60" cy="60" r="54"></circle>
                    </svg>
                    <div class="progress-ring-text">
                        <div class="number" id="progress-pct">-</div>
                        <div class="label">Completo</div>
                    </div>
                </div>
                <div class="progress-ring-info">
                    <h3 id="progress-materia">-</h3>
                    <p>Matéria em destaque</p>
                    <div class="progress-ring-stats">
                        <div class="progress-ring-stat">
                            <div class="value" id="progress-done">-</div>
                            <div class="label">Completas</div>
                        </div>
                        <div class="progress-ring-stat">
                            <div class="value" id="progress-left">-</div>
                            <div class="label">Faltam</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- CARDS GRID -->
        <h2 style="margin-bottom: 20px; font-size: 1.3em; font-weight: 600;">O QUE ESTUDAR?</h2>
        <div class="cards-grid" id="cards-grid">
            <div class="loading">
                <div class="spinner"></div>
                <p>Carregando suas matérias...</p>
            </div>
        </div>

        <!-- BADGES -->
        <h2 style="margin: 32px 0 20px; font-size: 1.3em; font-weight: 600;">Seus Badges 🏆</h2>
        <div class="badges-section">
            <div class="badges-grid" id="badges-grid">
                <div class="loading">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- CONFETTI CONTAINER -->
    <div class="confetti-container" id="confetti-container"></div>

    <script>
        const API = '/api';
        let allData = null;

        async function load() {
            try {
                const [pci, materias] = await Promise.all([
                    fetch(`${API}/stats/pci`).then(r => r.json()),
                    fetch(`${API}/stats/materias`).then(r => r.json())
                ]);
                allData = { pci, materias };
                render();
                triggerAnimation();
            } catch (e) {
                console.error(e);
                document.getElementById('cards-grid').innerHTML =
                    '<div style="color: #dc2626;">Erro ao carregar. Verifique a API.</div>';
            }
        }

        function render() {
            updateTopBar();
            updateWelcome();
            updateCards();
            updateBadges();
        }

        function updateTopBar() {
            // Streak: aleatório 3-15 dias
            const streak = Math.floor(Math.random() * 12) + 3;
            document.getElementById('streak').textContent = streak;

            // XP: total de questões / 10
            const xp = Math.floor((allData.pci.total_pci || 0) / 10);
            document.getElementById('xp').textContent = xp.toLocaleString('pt-BR');
        }

        function updateWelcome() {
            const { materias } = allData;
            if (!materias.por_materia || materias.por_materia.length === 0) return;

            const topMateria = materias.por_materia[0];
            const pct = Math.round((topMateria.count / (allData.pci.total_pci || 1)) * 100);

            document.getElementById('progress-pct').textContent = pct + '%';
            document.getElementById('progress-materia').textContent = topMateria.materia;
            document.getElementById('progress-done').textContent = topMateria.count.toLocaleString('pt-BR');
            document.getElementById('progress-left').textContent =
                Math.max(0, (allData.pci.total_pci || 0) - topMateria.count).toLocaleString('pt-BR');

            // Animar ring
            const circle = document.querySelector('.progress-ring-circle-fill');
            if (circle) {
                const circumference = 2 * Math.PI * 54;
                const offset = circumference - (pct / 100) * circumference;
                circle.style.strokeDashoffset = offset;
            }
        }

        function updateCards() {
            const { materias, pci } = allData;
            if (!materias.por_materia) {
                document.getElementById('cards-grid').innerHTML =
                    '<p>Nenhuma matéria encontrada</p>';
                return;
            }

            const html = materias.por_materia
                .slice(0, 6)
                .map((mat, idx) => {
                    const pct = Math.round((mat.count / (pci.total_pci || 1)) * 100);
                    const icons = ['📚', '⚖️', '🧮', '🌍', '🔬', '📖'];
                    const icon = icons[idx % icons.length];

                    return `
                        <div class="card">
                            <div class="card-icon">${icon}</div>
                            <div class="card-title">${mat.materia}</div>
                            <div class="card-subtitle">${mat.count.toLocaleString('pt-BR')} questões</div>
                            <div class="card-progress">
                                <div class="card-progress-fill" style="width: ${pct}%"></div>
                            </div>
                            <div class="card-stats">
                                <span class="card-stat-label">Progresso:</span>
                                <span class="card-stat-value">${pct}%</span>
                            </div>
                            <button class="card-cta" onclick="celebrate()">Estudar Agora →</button>
                        </div>
                    `;
                }).join('');

            document.getElementById('cards-grid').innerHTML = html;
        }

        function updateBadges() {
            const badges = [
                { name: 'Penalista', icon: '⚖️', condition: allData.pci.total_pci > 10000 },
                { name: 'Leitor', icon: '📚', condition: allData.pci.total_pci > 5000 },
                { name: 'Streaker', icon: '🔥', condition: true },
                { name: 'Sniper', icon: '🎯', condition: allData.pci.total_pci > 30000 },
                { name: 'Mestre', icon: '👑', condition: allData.pci.total_pci > 50000 },
                { name: 'Finalista', icon: '🏆', condition: allData.pci.total_pci > 40000 }
            ];

            const html = badges.map(b => `
                <div class="badge ${b.condition ? 'unlocked' : 'locked'}">
                    <div class="badge-icon">${b.icon}</div>
                    <div class="badge-name">${b.name}</div>
                </div>
            `).join('');

            document.getElementById('badges-grid').innerHTML = html;
        }

        function celebrate() {
            // Confete
            for (let i = 0; i < 30; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.delay = Math.random() * 0.5 + 's';
                confetti.style.background = [
                    'var(--primary)', 'var(--secondary)', 'var(--gold)', 'var(--success)'
                ][Math.floor(Math.random() * 4)];
                document.getElementById('confetti-container').appendChild(confetti);
            }

            // Limpar confete
            setTimeout(() => {
                document.getElementById('confetti-container').innerHTML = '';
            }, 3500);

            // Alert
            alert('🎉 Sessão de estudo iniciada!\n\nProximo passo: Selecione uma categoria para começar.');
        }

        function triggerAnimation() {
            // Animar números
            animateValue('progress-pct', 0, parseInt(document.getElementById('progress-pct').textContent), 800);
        }

        function animateValue(id, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                const value = Math.floor(progress * (end - start) + start);
                const elem = document.getElementById(id);
                if (elem) elem.textContent = value + '%';
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            };
            window.requestAnimationFrame(step);
        }

        // Load on start
        load();

        // Reload a cada 30s
        setInterval(load, 30000);
    </script>
</body>
</html>
