      - "Polícia judiciária militar."
      - "Inquérito policial militar."
      - "Ação penal militar e seu exercício."
      - "Processo."
      - "Denúncia."
      - "Jurisdição e competência."
      - "Questões prejudiciais e incidentes."
      - "Medidas preventivas e assecuratórias."
      - "Atos probatórios."
      - "Processo ordinário."
      - "Processos especiais."
      - "Nulidades e recursos."

  "Criminologia":
    peso_grupo_conhecimentos_especificos: 40  # CONFERIR: total do grupo, quebra por matéria não confirmada
    conteudos:
      - "Criminologia: Conceito e características; Objeto; Método e finalidade; Funções; Classificação."
