<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Banco de Questões por Matéria</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .stat-card h3 {
            color: #667eea;
            font-size: 0.9em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 2.5em;
            font-weight: bold;
            color: #333;
        }

        .materias-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .materia-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .materia-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.2);
        }

        .materia-name {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }

        .materia-stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .materia-stat {
            font-size: 0.9em;
            color: #666;
        }

        .materia-stat-value {
            font-weight: bold;
            color: #667eea;
            font-size: 1.3em;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #eee;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 4px;
            transition: width 0.3s;
        }

        .conteudo {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #eee;
            font-size: 0.85em;
            color: #999;
        }

        .fonte {
            display: inline-block;
            margin-right: 10px;
            padding: 2px 8px;
            background: #f0f0f0;
            border-radius: 4px;
            font-size: 0.8em;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2em;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Banco de Questões - Organizado por Matéria</h1>

        <div class="stats">
            <div class="stat-card">
                <h3>Total de Questões</h3>
                <div class="value" id="total-questoes">-</div>
            </div>
            <div class="stat-card">
                <h3>Matérias</h3>
                <div class="value" id="total-materias">-</div>
            </div>
            <div class="stat-card">
                <h3>Fontes</h3>
                <div class="value" id="total-fontes">-</div>
            </div>
            <div class="stat-card">
                <h3>Conteúdos</h3>
                <div class="value" id="total-conteudos">-</div>
            </div>
        </div>

        <div id="materias-container" class="materias-grid">
            <div class="loading">Carregando dados...</div>
        </div>
    </div>

    <script>
        async function loadDashboard() {
            try {
                // Fetch stats
                const resp = await fetch('/api/stats/materias');
                const data = await resp.json();

                // Update summary stats
                document.getElementById('total-questoes').textContent = data.total.toLocaleString('pt-BR');
                document.getElementById('total-materias').textContent = data.materias_unicas;
                document.getElementById('total-fontes').textContent = data.fontes_unicas;
                document.getElementById('total-conteudos').textContent = data.categorias_unicas;

                // Render materia cards
                const container = document.getElementById('materias-container');
                container.innerHTML = '';

                data.por_materia.forEach(mat => {
                    const card = document.createElement('div');
                    card.className = 'materia-card';

                    const pct = (mat.count / data.total * 100).toFixed(1);
                    const categorias = mat.categorias ? mat.categorias.split(',').slice(0, 3).join(', ') : 'N/A';

                    card.innerHTML = `
                        <div class="materia-name">${mat.materia}</div>
                        <div class="materia-stats">
                            <div class="materia-stat">
                                Questões: <span class="materia-stat-value">${mat.count}</span>
                            </div>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${pct}%"></div>
                        </div>
                        <div class="conteudo">
                            ${mat.fontes ? `<span class="fonte">${mat.fontes}</span>` : ''}
                            ${categorias !== 'N/A' ? `<span class="fonte">Conteúdo: ${categorias.substring(0, 30)}...</span>` : ''}
                        </div>
                    `;

                    container.appendChild(card);
                });

            } catch (error) {
                console.error('Erro carregando dashboard:', error);
                document.getElementById('materias-container').innerHTML =
                    '<div class="loading">Erro ao carregar dados</div>';
            }
        }

        // Load on page load
        document.addEventListener('DOMContentLoaded', loadDashboard);

        // Refresh a cada 30 segundos
        setInterval(loadDashboard, 30000);
    </script>
</body>
</html>
