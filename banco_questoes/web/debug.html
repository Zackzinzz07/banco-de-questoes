<!DOCTYPE html>
<html>
<head>
    <title>Debug - Estatísticas</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .container { max-width: 1200px; }
        h1 { color: #333; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 DEBUG - Estatísticas de Todas as Questões</h1>

        <h2>Carregando dados...</h2>
        <div id="resultado">Aguarde...</div>
    </div>

    <script>
        async function debug() {
            try {
                console.log('1. Iniciando fetch de /api/stats/todas');
                const resp = await fetch('/api/stats/todas');
                console.log('2. Resposta recebida:', resp.status);

                const data = await resp.json();
                console.log('3. JSON parseado:', data);

                const div = document.getElementById('resultado');

                let html = `
                    <h2>✅ Sucesso!</h2>
                    <p><strong>Total de Questões: ${data.total}</strong></p>

                    <h3>Por Matéria:</h3>
                    <ul>
                `;

                Object.entries(data.por_materia).forEach(([materia, count]) => {
                    html += `<li>${materia}: <strong>${count}</strong></li>`;
                });

                html += `</ul>
                    <h3>Por Órgão:</h3>
                    <ul>
                `;

                Object.entries(data.por_orgao).forEach(([orgao, count]) => {
                    html += `<li>${orgao}: <strong>${count}</strong></li>`;
                });

                html += '</ul>';

                div.innerHTML = html;
            } catch (erro) {
                console.error('ERRO:', erro);
                document.getElementById('resultado').innerHTML = `
                    <h2>❌ Erro!</h2>
                    <p>${erro.message}</p>
                    <pre>${erro.stack}</pre>
                `;
            }
        }

        // Chamar ao carregar
        window.addEventListener('DOMContentLoaded', debug);
    </script>
</body>
</html>
